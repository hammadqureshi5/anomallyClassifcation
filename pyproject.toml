[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acds-threat-classification"
version = "0.1.0"
description = "Two-tier network threat classification module for the Autonomous Cyber Defense System (ACDS)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Muhammad Bilal Khan" }]
keywords = ["intrusion-detection", "network-security", "mitre-attack", "lightgbm", "catboost"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.24,<2.0",
  "pandas>=2.0,<3.0",
  "scikit-learn>=1.3,<1.6",
  "joblib>=1.3",
  "lightgbm>=4.0",
  "catboost>=1.2",
  "category-encoders>=2.6",
  "imbalanced-learn>=0.11",
]

[project.scripts]
acds-threat = "acds.threat_classifier:_cli"

[tool.setuptools]
packages = ["acds"]

[tool.ruff]
line-length = 100
target-version = "py310"
