# IMPROVED (v2) configuration for cicids2017, generated by `python -m experiments.tune --dataset cicids2017`.
# Every value was chosen on the validation split of the training data (never the test set).
# See reports/improvement/cicids2017/tuning.json for all candidates.
detectors:
- lof
- autoencoder
primary_detector: ensemble
threshold_percentile: 97.0
severity_percentiles:
  medium: 99.7
  high: 99.95
val_fraction: 0.2
max_train_samples: 50000
random_state: 42
top_k_features: 3
features:
  corr_threshold: 0.99
ensemble:
  normalization: rank
  combine: mean
robust_z:
  top_k: 3
iforest:
  n_estimators: 200
  max_samples: 4096
  max_features: 0.5
lof:
  n_neighbors: 10
  max_train_samples: 30000
autoencoder:
  hidden_layer_sizes: null
  max_iter: 200
  alpha: 0.0001
  bottleneck_ratio: 0.25
data:
  cicids_sample_frac: 0.1
  test_size: 0.3
  cicids_drop_duplicates: true
